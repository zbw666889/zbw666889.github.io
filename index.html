<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花落外挂卡密</title>
<style>
  :root{
    --bg:#0f1218;
    --panel:#171c26;
    --panel-2:#1e2532;
    --line:#2a3345;
    --text:#e6ebf5;
    --muted:#8b97ab;
    --accent:#4f8cff;
    --accent-2:#7c5cff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(79,140,255,.18), transparent 60%),
      radial-gradient(800px 500px at 85% 0%, rgba(124,92,255,.16), transparent 60%),
      var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
  }

  /* 顶栏 */
  header{
    border-bottom:1px solid var(--line);
    background:rgba(15,18,24,.75);
    backdrop-filter:blur(12px);
  }
  .nav{
    max-width:960px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; gap:10px;
  }
  .logo-mark{
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid; place-items:center; font-size:15px;
  }
  .logo-text{font-weight:700; letter-spacing:.5px;}

  /* 主内容 */
  main{
    flex:1;
    max-width:960px; width:100%;
    margin:0 auto;
    padding:60px 20px 80px;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
  }

  .card{
    width:100%; max-width:420px;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);
    border-radius:20px;
    padding:34px 28px 28px;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
    text-align:center;
  }

  .card h1{
    font-size:24px; margin:0 0 10px;
    background:linear-gradient(120deg,#fff,#9fb6da);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .desc{
    color:var(--muted); font-size:14px; line-height:1.7;
    margin:0 0 22px;
  }

  .price{
    font-size:34px; font-weight:700; color:#fff;
    margin-bottom:26px;
  }
  .price small{font-size:14px; font-weight:400; color:var(--muted); margin-left:6px;}

  .btn{
    width:100%;
    border:0; cursor:pointer; font-family:inherit;
    font-size:15px; font-weight:600;
    padding:14px 16px; border-radius:12px; color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    transition:filter .2s, transform .1s;
  }
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:scale(.985);}

  /* 弹窗 */
  .overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(6,9,14,.72);
    backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .overlay.show{display:flex; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .modal{
    width:100%; max-width:380px;
    min-height:215px;
    display:flex; flex-direction:column; justify-content:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px;
    text-align:center;
    animation:pop .22s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop{from{transform:translateY(14px) scale(.97); opacity:0}to{transform:none; opacity:1}}

  .modal h2{font-size:18px; margin:0 0 6px;}
  .modal .sub{color:var(--muted); font-size:13px; margin:0 0 20px;}

  /* 加载状态 */
  .loading{ text-align:center; }
  .spinner{
    width:44px; height:44px;
    margin:0 auto 18px;
    border-radius:50%;
    border:3px solid rgba(79,140,255,.25);
    border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading p{
    margin:0;
    font-size:14px;
    color:var(--muted);
    letter-spacing:.5px;
  }

  /* 卡密 */
  .code{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:18px; letter-spacing:1px;
    color:#9fc0ff;
    background:var(--bg);
    border:1px dashed rgba(79,140,255,.5);
    border-radius:12px;
    padding:16px 14px;
    margin-bottom:22px;
    word-break:break-all;
    user-select:all;
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo-mark">◈</div>
    <div class="logo-text">花落官网</div>
  </div>
</header>

<main>
  <div class="card">
    <h1>花落外挂卡密</h1>
    <p class="desc">点击下方按钮获取卡密，卡密即时显示。</p>
    <div class="price">¥0<small>免费</small></div>
    <button class="btn" id="buyBtn">立即购买</button>
  </div>
</main>

<!-- 弹窗容器 -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
  const overlay = document.getElementById('overlay');
  const modal   = document.getElementById('modal');
  const buyBtn  = document.getElementById('buyBtn');

  /* 可随机抽取的卡密池 */
  const CODES = ['hualuopd', 'hualuonb666', 'hualuonb'];

  const LOADING_HTML = `
    <div class="loading">
      <div class="spinner"></div>
      <p>正在加载中...</p>
    </div>
  `;

  /* 随机取一个卡密，生成卡密弹窗内容 */
  function buildCodeHTML(){
    const code = CODES[Math.floor(Math.random() * CODES.length)];
    return `
      <h2>获取成功</h2>
      <p class="sub">您的卡密如下，请及时保存</p>
      <div class="code">您的卡密为:${code}</div>
      <button class="btn" id="closeBtn">关闭</button>
    `;
  }

  let timer = null;

  /* 点击购买 → 先展示加载 → 再展示随机卡密 */
  buyBtn.addEventListener('click', () => {
    modal.innerHTML = LOADING_HTML;
    overlay.classList.add('show');

    timer = setTimeout(() => {
      timer = null;
      modal.innerHTML = buildCodeHTML();
      document.getElementById('closeBtn').addEventListener('click', close);
    }, 1500);
  });

  /* 点击遮罩关闭 */
  overlay.addEventListener('click', e => {
    if (e.target === overlay) close();
  });

  /* ESC 关闭 */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') close();
  });

  /* 关闭并清理定时器 */
  function close(){
    if (timer) {
      clearTimeout(timer);
      timer = null;
    }
    overlay.classList.remove('show');
  }
</script>
</body>
</html>
